name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: make lint
      - run: make data
      - run: make train
      - run: make test
      - uses: actions/upload-artifact@v4
        with:
          name: model-card
          path: models/model_card.json
